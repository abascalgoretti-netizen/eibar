<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Itinerarios de inclusión sociolaboral en Eibar</title>
<meta name="description" content="A dónde acudir según lo que se necesita: servicios, contactos y pasos habituales del itinerario de inclusión sociolaboral en Eibar.">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wdth,wght@75..125,700..1000&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#001C93; --blue-ink:#001C93; --blue-2:#0a2aa8; --blue-soft:#e8ebfa; --magenta:#CE004A; --magenta-ink:#CE004A; --pink:#ff8db4; --magenta-soft:#fbe6ee;
  --ink:#1b1e33; --ink-soft:#4d5170; --line:#e1e3ec; --paper:#ffffff; --card:#f3f3f6; --surface:#ffffff;
  --warn-bg:#fff6e5; --warn-ink:#7a5410; --warn-line:#f0dfb8;
  --c-magenta:#CE004A; --c-blue:#001C93; --c-purple:#6a2fa8; --c-teal:#0b7a6c; --c-green:#2d8249;
  --am-prestaciones:#a8680f; --am-apoyo:#0b7a6c; --am-salud:#2d8249; --am-vivienda:#855634;
  --n1:#CE004A; --n2:#a3003b; --n3:#76002b;
  --shadow:0 1px 2px rgba(0,20,90,.05),0 6px 18px rgba(0,20,90,.06); --shadow-lg:0 14px 44px rgba(0,20,90,.22);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
.disp,h1,h2{font-family:'Nunito Sans','Montserrat',system-ui,sans-serif;font-stretch:125%;font-weight:900;text-wrap:balance}
h3,h4{font-family:'Montserrat',system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--blue-ink)}
:focus-visible{outline:3px solid var(--magenta);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto;padding-inline:20px}
@media(max-width:520px){.wrap{padding-inline:16px}}
.skip{position:absolute;left:-999px;top:0;background:#fff;padding:8px 12px;z-index:100}
.skip:focus{left:8px}

/* cabecera */
.top{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.logos{display:flex;align-items:center;gap:10px}
.logo{height:52px;display:flex;align-items:center;background:#fff;border-radius:10px;padding:6px 10px}
.logo img{height:40px;width:auto;display:block}
.tabs{display:flex;gap:4px;margin-left:auto;background:var(--card);border-radius:999px;padding:3px}
.tabs button{border:0;background:transparent;border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:700;color:var(--ink-soft)}
.tabs button[aria-current="page"]{background:var(--blue);color:#fff}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;padding:7px 11px;font-size:12px;font-weight:800;color:var(--ink-soft)}
.lang button[aria-pressed="true"]{background:var(--magenta);color:#fff}
@media(max-width:720px){.top{position:static}.tabs{order:3;margin-left:0;width:100%;justify-content:space-between}.tabs button{flex:1;padding-inline:6px}.lang{margin-left:auto}.logo{height:44px;padding:5px 8px}.logo img{height:32px}}

.view{display:none;padding-block:0 60px}
.view.on{display:block}
.kicker{font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--magenta-ink);margin:0 0 8px}
.h1{font-size:clamp(28px,4.4vw,44px);line-height:1.08;margin:0 0 10px;color:var(--blue-ink)}
.lead{font-size:15.5px;color:var(--ink-soft);max-width:70ch;margin:0}
.phead{padding-top:30px;margin-bottom:18px}

/* portada */
.hero{background:#001C93;color:#fff}
.hero .wrap{padding-block:34px 36px}
.hero .kicker{color:var(--pink)}
.hero .h1{color:#fff}
.hero .lead{color:#dfe4ff}
.sec{padding-top:26px}
.sec h2{font-size:22px;color:var(--blue-ink);margin:0 0 12px}
.needs-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
@media(max-width:860px){.needs-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.needs-grid{grid-template-columns:1fr}}
.need{position:relative;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 40px 12px 12px;display:flex;gap:12px;align-items:flex-start}
.need:hover{border-color:var(--blue)}
.need .ni{width:36px;height:36px;border-radius:50%;background:var(--blue-soft);color:var(--blue-ink);display:grid;place-items:center;flex:0 0 auto}
.need .ni svg{width:19px;height:19px}
.need b{display:block;font-size:14.2px;font-weight:800;line-height:1.2;color:var(--blue-ink)}
.need small{display:block;font-size:12.2px;color:var(--ink-soft);line-height:1.3;margin-top:2px}
.need .ck{position:absolute;top:12px;right:12px;width:20px;height:20px;border-radius:6px;border:1.5px solid #c5c9d8;display:grid;place-items:center;color:#fff;background:var(--surface)}
.need .ck svg{width:12px;height:12px;opacity:0}
.need[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.need[aria-pressed="true"] .ck{background:var(--blue);border-color:var(--blue)}
.need[aria-pressed="true"] .ck svg{opacity:1}
.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:11px;padding:12px 18px;font-weight:800;font-size:14.3px;display:inline-flex;gap:9px;align-items:center}
.btn svg{width:16px;height:16px}
.btn-p{background:var(--magenta);color:#fff}
.btn-p:disabled{opacity:.45;cursor:not-allowed}
.btn-p .cnt{background:rgba(255,255,255,.25);border-radius:999px;padding:0 8px;font-size:12px}
.btn-g{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.howto{background:var(--card);border-radius:10px;padding:12px 14px;font-size:13.3px;color:var(--ink-soft);margin:18px 0 0}
.howto b{color:var(--ink)}
.home2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
@media(max-width:760px){.home2{grid-template-columns:1fr}}
.startbox{background:#001C93;color:#fff;border-radius:14px;padding:16px 18px}
.startbox h3{margin:0 0 6px;font-size:16px;font-weight:800}
.startbox .it{display:block;width:100%;text-align:left;background:transparent;border:0;padding:8px 0;color:#fff;border-top:1px solid rgba(255,255,255,.14)}
.startbox .it:first-of-type{border-top:0}
.startbox .it b{display:block;font-size:14px}
.startbox .it span{display:block;font-size:13px;color:#dfe4ff}
.startbox .it small{display:inline-flex;gap:6px;align-items:center;font-weight:700;color:var(--pink);font-size:12.5px;margin-top:2px}
.startbox .it small svg{width:13px;height:13px}
.boxes{display:flex;flex-direction:column;gap:10px}
.box{display:block;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--blue);border-radius:12px;padding:11px 14px}
.box b{display:block;color:var(--blue-ink);font-size:15px;font-weight:800}
.box span{display:block;font-size:13px;color:var(--ink-soft)}
button.box:hover{background:var(--blue-soft)}
.box.warn{border-color:var(--magenta)}
.box.warn b{color:var(--magenta-ink)}

/* resultado por necesidad */
.res-sec{padding:18px 0 20px;border-top:3px solid var(--blue)}
.res-sec + .res-sec{margin-top:6px}
.rh{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.rh .ni{width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;flex:0 0 auto}
.rh .ni svg{width:18px;height:18px}
.rh h2{margin:0;font-size:22px;color:var(--blue-ink);line-height:1.1}
.rh small{display:block;font-size:12.5px;color:var(--ink-soft)}
.intro{background:var(--warn-bg);color:var(--warn-ink);border-radius:8px;padding:9px 12px;font-size:13.3px;margin:0 0 14px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.cards{grid-template-columns:1fr}}
.ecard{background:var(--card);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.nm-link{border:0;background:none;padding:0;text-align:left;font-size:14.3px;font-weight:800;line-height:1.25;color:var(--blue-ink);text-decoration:underline;text-underline-offset:3px}
.ecard p{margin:0;font-size:13px;color:var(--ink-soft)}
.contact{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:13px;font-weight:700;color:var(--blue-ink);margin-top:auto}
.contact span,.contact a{display:inline-flex;gap:5px;align-items:center;color:inherit;text-decoration:none}
.contact a:hover{text-decoration:underline}
.contact svg{width:13px;height:13px;flex:0 0 auto}
.also{margin:14px 0 0}
.also h3{font-size:13.5px;font-weight:800;margin:0 0 6px}
.also ul{margin:0;padding-left:18px;font-size:13.3px;color:var(--ink-soft)}
.also li{margin:3px 0}
.also .nm-link{font-size:13.3px}

/* itinerario */
.it-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px}
@media(max-width:860px){.it-grid{grid-template-columns:1fr}}
.it-col h2{font-size:19px;color:var(--blue-ink);margin:0 0 12px}
.it-col p.d{font-size:13.3px;color:var(--ink-soft);margin:-6px 0 12px}
.step{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:8px 10px;border-radius:12px;margin-bottom:4px}
.step.here{background:var(--blue-soft)}
.step .num{width:26px;height:26px;border-radius:7px;background:var(--blue);color:#fff;font-weight:900;font-size:13px;display:grid;place-items:center}
.step h3{margin:2px 0 6px;font-size:14.3px;font-weight:800}
.pill{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--magenta);color:#fff;margin-left:6px;vertical-align:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12.3px;font-weight:700;color:var(--blue-ink)}
.chip:hover{border-color:var(--blue)}
.chip.off{color:var(--ink-soft);border-style:dashed;cursor:default}
.snote{font-size:12.5px;color:var(--ink-soft);margin:6px 0 0}
.sup{border:1.5px solid var(--sc);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.sup h3{margin:0 0 8px;font-size:14px;font-weight:800;color:var(--sc)}
.sup.active{background:color-mix(in srgb,var(--sc) 8%,#fff)}
.negocio .step .num{background:var(--sc)}

/* directorio */
.dir-tools{display:flex;gap:10px;margin:0 0 6px}
.dir-tools input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit}
.cat{margin-top:24px}
.cat > h2{font-family:'Montserrat',sans-serif;font-stretch:100%;font-size:13.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin:0 0 10px;color:var(--cc)}
.cat > h2::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:currentColor;margin-right:8px;vertical-align:1px}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(max-width:700px){.dgrid{grid-template-columns:1fr}}
.dcard{background:var(--card);border-radius:10px;border-left:4px solid var(--cc);padding:12px 14px;display:flex;flex-direction:column;gap:6px;scroll-margin-top:90px}
.dcard.flash{box-shadow:0 0 0 3px var(--magenta)}
.dk{font-size:10.8px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--magenta-ink)}
.dcard h3{margin:0;font-size:15px;font-weight:800;color:var(--blue-ink);line-height:1.25}
.dcard p{margin:0;font-size:13px;color:var(--ink-soft)}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:10.8px;font-weight:800;padding:2px 8px;border-radius:999px;line-height:1.4}
.t-door{background:var(--magenta-soft);color:var(--magenta-ink)} .t-lan{background:#e3f4ef;color:#0b6b58} .t-new{background:var(--warn-bg);color:var(--warn-ink)}
.helps{font-size:12.3px;color:var(--ink-soft)}
.helps b{color:var(--ink)}
.obox{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-ink);border-radius:8px;padding:8px 10px;font-size:12.6px}

.foot{border-top:1px solid var(--line);color:var(--ink-soft);font-size:12.3px}
.foot .wrap{padding-block:20px 30px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.foot p{margin:0;flex:1;min-width:240px}
.foot small{display:block;margin-top:4px;font-size:11.3px;opacity:.85}
@media (prefers-reduced-motion: reduce){*{transition:none!important}html{scroll-behavior:auto}}
@media print{.top,.tabs,.lang,.actions,.dir-tools{display:none!important}.view{display:block!important}}
</style>
</head>

const nrm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
function parseCSV(txt){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<txt.length;i++){const c=txt[i];
    if(q){ if(c==='"'){ if(txt[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true; else if(c===','){row.push(f);f='';}
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&txt[i+1]==='\n') i++; row.push(f);f=''; if(row.some(x=>x.trim()))rows.push(row); row=[]; }
    else f+=c; }
  row.push(f); if(row.some(x=>x.trim()))rows.push(row); return rows;
}
const titleIfCaps=s=>(s&&s===s.toUpperCase()&&/[A-ZÑ]{4}/.test(s))?s.toLowerCase().replace(/(^|[\s,(/-])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase()):s;
const cWeb=s=>{const m=String(s).match(/(https?:\/\/)?[\w-]+(\.[\w-]+)+(\/[^\s)]*)?/i);return m?m[0].replace(/^https?:\/\//i,'').replace(/\/$/,''):''};
const cDir=s=>titleIfCaps(String(s).trim()).replace(/\s*\(?gipuzkoa\)?/ig,'').replace(/\b20600\b/g,'').replace(/[\s,.-]*eibar$/i,'').replace(/[\s,.-]+$/,'').replace(/\s{2,}/g,' ').trim();

}
function applyLive(rows){
  const H=rows[0].map(h=>String(h).replace(/\s+/g,' ').trim());
  const col=test=>H.findIndex(test);
  const C={nom:1,web:col(h=>/p[aá]gina web/i.test(h)),dir:col(h=>/direcci[oó]n completa/i.test(h)),desc:col(h=>/describa brevemente/i.test(h)),bj:col(h=>/EN EIBAR$/i.test(h)&&!/FUERA/i.test(h))};
  const g=(r,k)=>C[k]>=0?String(r[C[k]]??'').trim():'';
  const seen=new Set(); let nuevos=0, n=0;
  rows.slice(1).forEach(r=>{
    const nom=g(r,'nom'); if(!nom) return; n++;
    const hit=MATCH.find(([k,re])=>!seen.has(k)&&re.test(nrm(nom)));
    if(hit){ seen.add(hit[0]); return; }
    const id='nueva'+(++nuevos); if(OCULTAS.has(id)) return;
    const d=cDir(g(r,'dir'));
    E[id]={real:true,excel:true,nuevo:true,cat:'',nombre_es:titleIfCaps(nom),texto_es:g(r,'bj')||g(r,'desc'),dir_es:d,web:cWeb(g(r,'web')),tel:''};
  });
  Object.keys(E).forEach(k=>{ if(E[k].excel && !E[k].nuevo && !seen.has(k)) quitarEntidad(k); });
  return n;
}
/* CORRECCIONES · ID | ENTIDAD | ACCIÓN | CAMPO | VALOR (castellano) | VALOR (euskera) | MOTIVO | QUIÉN | FECHA | ACTIVA
   ACCIÓN: corregir · ocultar · desdoblar · añadir · quitar
   CAMPO (entidad): nombre, corto, tipo, texto (también «resumen», «eibar», «descripción»), dir, tel, web, cat, aviso, tarjeta:<necesidad>
   CAMPO (ENTIDAD = necesidad:<id>): nombre, subtitulo, nota */
const CAMPOS_TXT=['nombre','corto','tipo','texto','dir','aviso'];
const ALIAS={'resumen':'texto','eibar':'texto','en eibar':'texto','eibarren':'texto','descripcion':'texto','direccion':'dir','telefono':'tel','categoria':'cat','nombre corto':'corto'};
const BASE=fechaNum(DATA.meta.base);
function fechaNum(s){ const m=String(s||'').match(/(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/); if(m){const y=+m[3]<100?2000+ +m[3]:+m[3]; return y*10000+ +m[2]*100+ +m[1];}
  const d=String(s||'').match(/Date\((\d{4}),(\d{1,2}),(\d{1,2})/); if(d) return +d[1]*10000+(+d[2]+1)*100+ +d[3]; return null; }
function applyCorrecciones(rows){
  const H=rows[0].map(h=>nrm(h));
  const ix=(re,def)=>{const i=H.findIndex(h=>re.test(h)); return i>=0?i:def;};
  const I={ent:ix(/^entidad/,1),acc:ix(/^accion/,2),campo:ix(/^campo/,3),es:ix(/castellano|^valor$|valor es/,4),eu:ix(/euskera|valor eu/,5),fecha:ix(/^fecha/,8),act:ix(/^activa/,9)};
  const res={estado:'ok',nuevas:0,incluidas:0,avisos:0};
  rows.slice(1).forEach((r,i)=>{
    const v=k=>String(r[I[k]]??'').trim();
    if(!v('ent')&&!v('acc')) return;
    if(/^(no|ez|0|false)\b/i.test(v('act'))) return;
    const f=fechaNum(v('fecha')); if(f!=null && f<=BASE){ res.incluidas++; return; }
    const ent=nrm(v('ent')).replace(/\s+/g,''), acc=nrm(v('acc')), es=v('es'), eu=v('eu');
    let campo=nrm(v('campo')); campo=ALIAS[campo]||campo;
    const aviso=m=>{res.avisos++; LIVE.avisos.push(`Fila ${i+2}: ${m}`);}, ok=()=>res.nuevas++;
    if(ent.startsWith('necesidad:')){
      const ne=NB[ent.split(':')[1]]; if(!ne) return aviso('necesidad desconocida');
      const k={nota:'nota',subtitulo:'sub',nombre:''}[campo]; if(k===undefined) return aviso('campo de necesidad desconocido');
      if(k){ if(es) ne[k+'_es']=es; if(eu) ne[k+'_eu']=eu; } else { if(es) ne.es=es; if(eu) ne.eu=eu; }
      return ok();
    }
    if(acc==='ocultar'){
      if(!campo){ OCULTAS.add(ent); if(E[ent]) quitarEntidad(ent); return ok(); }
      if(!E[ent]) return aviso(`entidad «${ent}» desconocida`);
      if(CAMPOS_TXT.includes(campo)){E[ent][campo+'_es']='';E[ent][campo+'_eu']='';} else E[ent][campo]=''; return ok();
    }
    if(acc==='desdoblar'){
      const src=E[ent], nid=campo.replace(/\s+/g,''); if(!src) return aviso('entidad origen desconocida');
      if(!E[nid]) E[nid]={real:true,cat:src.cat,tipo_es:src.tipo_es,tipo_eu:src.tipo_eu,web:src.web,nombre_es:es||nid,nombre_eu:eu||es||nid};
      return ok();
    }
    if(acc==='anadir'||acc==='añadir'){
      if(!E[ent]) E[ent]={real:true,cat:'',nombre_es:ent,nombre_eu:ent};
      if(campo.startsWith('necesidad')){ const [nid,tipo]=es.split(':').map(x=>nrm(x)); const ne=NB[nid]; if(!ne) return aviso('necesidad desconocida');
        if(!ne.principal.some(x=>x.id===ent)&&!ne.tambien.some(x=>x.id===ent)) (tipo==='principal'?ne.principal:ne.tambien).push({id:ent,es:'',eu:''}); return ok(); }
      if(campo==='fase'){ const fz=FASES[nrm(es)]; if(!fz) return aviso('fase desconocida'); if(!fz.agentes.includes(ent)) fz.agentes.push(ent); return ok(); }
      if(!campo) return ok();
    }
    if(acc==='quitar'){
      const [tipo,ref]=es.split(':').map(x=>nrm(x));
      if(tipo==='necesidad'&&NB[ref]){ NB[ref].principal=NB[ref].principal.filter(x=>x.id!==ent); NB[ref].tambien=NB[ref].tambien.filter(x=>x.id!==ent); return ok(); }
      if(tipo==='fase'&&FASES[ref]){ FASES[ref].agentes=FASES[ref].agentes.filter(x=>x!==ent); return ok(); }
      return aviso('«quitar» necesita «necesidad:id» o «fase:id» en el valor');
    }
    const a=E[ent]; if(!a) return aviso(`entidad «${ent}» desconocida`);
    if(campo==='aviso'&&/^(no|ez)$/i.test(es)){ a.aviso_es=''; a.aviso_eu=''; return ok(); }
    if(CAMPOS_TXT.includes(campo)){ if(es) a[campo+'_es']=es; if(eu) a[campo+'_eu']=eu; return ok(); }
    if(['tel','web'].includes(campo)){ a[campo]=es; return ok(); }
    if(campo==='cat'){ if(CATS.some(c=>c.id===nrm(es))){a.cat=nrm(es); return ok();} return aviso('categoría desconocida (acogida, trabajo, cursos, euskera, salud)'); }
    if(campo.startsWith('tarjeta:')){ const ne=NB[campo.split(':')[1]]; if(!ne) return aviso('necesidad desconocida');
      const x=ne.principal.find(x=>x.id===ent)||ne.tambien.find(x=>x.id===ent); if(!x) return aviso('la entidad no está en esa necesidad');
      if(es) x.es=es; if(eu) x.eu=eu; return ok(); }
    aviso(`campo «${campo}» desconocido`);
  });
  return res;
}

}

    const to=setTimeout(()=>{cleanup();reject(new Error('timeout jsonp'))},12000);
    function cleanup(){clearTimeout(to);delete window[cb];sc.remove();}
    window[cb]=resp=>{cleanup();
      try{ if(resp.status==='error') throw new Error((resp.errors||[]).map(e=>e.detailed_message||e.message).join('; '));
        const tb=resp.table; const head=tb.cols.map(c=>c.label||'');
        resolve([head,...tb.rows.map(r=>(r.c||[]).map(c=>c?(c.f!=null?c.f:(c.v!=null?String(c.v):'')):''))]);}catch(e){reject(e);} };
    sc.onerror=()=>{cleanup();reject(new Error('script bloqueado'))};
    sc.src=GVIZ+'?headers=1&tqx=responseHandler:'+cb+extra+'&t='+Date.now();
    document.head.appendChild(sc);
  });
}
const okRows=r=>r && r.length>=2 && /marca temporal/i.test(r[0][0]||'');
async function leerRespuestas(){
  for(const [via,fn] of [['csv-publicado',()=>viaFetch(SHEET_CSV)],['jsonp-gviz',()=>viaJSONP('&gid=0')],['csv-gviz',()=>viaFetch(GVIZ+'?tqx=out:csv&headers=1&gid=0')]]){
    try{ const rows=await fn(); if(!okRows(rows)) throw new Error('formato inesperado'); return rows; }
    catch(err){ console.warn('Respuestas no disponibles vía',via,err); }
  }
  return null;
}
function esCorrecciones(rows){
  if(!rows||!rows[0]) return 'no';
  const h=rows[0].map(x=>nrm(x));
  if(h.some(x=>/^accion\b/.test(x)) && h.some(x=>/^entidad\b/.test(x))) return 'ok';
  if(h.filter(Boolean).length<=2 && /id,entidad,acci/.test(h.join(','))) return 'una-columna';
  return 'no';
}
async function leerCorrecciones(){
  let estado='no';
  for(const nom of ['CORRECCIONES','ZUZENKETAK']){
    const s='&sheet='+encodeURIComponent(nom);
    for(const [via,fn] of [['jsonp-gviz',()=>viaJSONP(s)],['csv-gviz',()=>viaFetch(GVIZ+'?tqx=out:csv&headers=1'+s)]]){
      try{ const rows=await fn(); const e=esCorrecciones(rows); if(e==='ok') return {estado:'ok',rows}; if(e==='una-columna') estado='una-columna'; break; }
      catch(err){ console.warn('Correcciones no disponibles vía',via,nom,err); }
    }
  }
  return {estado,rows:null};
}
async function loadLive(){
  if(window.__TEST_ROWS){ const c=window.__TEST_CORR||null; const e=esCorrecciones(c); return finish(window.__TEST_ROWS,{estado:e,rows:e==='ok'?c:null}); }
  const [rows,corr]=await Promise.all([leerRespuestas(),leerCorrecciones()]);
  finish(rows,corr);
}
function finish(rows,corr){
  if(!rows){ LIVE.state='fail'; render(); return; }
  if(corr.rows) corr.rows.slice(1).forEach(r=>{ const f=fechaNum(r[8]); if(/ocultar/i.test(r[2]||'')&&!String(r[3]||'').trim()&&!(f!=null&&f<=BASE)&&!/^(no|ez)/i.test(r[9]||'')) OCULTAS.add(nrm(r[1]).replace(/\s+/g,'')); });
  LIVE.n=applyLive(rows);
  LIVE.corr=corr.rows?applyCorrecciones(corr.rows):{estado:corr.estado,nuevas:0,incluidas:0,avisos:0};
  LIVE.state='ok';
  if(LIVE.avisos.length) console.warn('Correcciones no aplicadas:\n'+LIVE.avisos.join('\n'));
  render();
}

try{const s=localStorage.getItem('ibil-lang'); if(s==='eu'||s==='es'){LANG=s;document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===LANG)));}}catch(_){}
const h0=(location.hash||'').slice(1); if(['itin','dir'].includes(h0)) VIEW=h0;
setView(VIEW,false);
loadLive();
