<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>Itinerarios de inclusión · Eibar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@700;800;900&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#001C93; --blue-ink:#001C93; --blue-soft:#e8ebfa; --magenta:#CE004A; --magenta-soft:#fbe6ee;
  --ink:#141a33; --ink-soft:#4d5474; --line:#dde1ee; --paper:#f5f6fb; --surface:#ffffff;
  --acad:#6a2fa8; --acad-soft:#f1e9fa; --emp:#001C93; --emp-soft:#e8ebfa; --lan:#0b6b58; --lan-soft:#e3f4ef;
  --warn-bg:#fff6e5; --warn-ink:#7a5410; --warn-line:#f0dfb8;
  --am-acogida:#5a6385; --am-diagnostico:#3b3fb5; --am-formacion:#6a2fa8; --am-orientlab:#001C93; --am-empleo:#CE004A;
  --am-seguimiento:#2f6f86; --am-prestaciones:#a8680f; --am-apoyo:#0b7a6c; --am-salud:#2d8249; --am-vivienda:#855634;
  --am-emp_idea:#CE004A; --am-emp_aseso:#a3003b; --am-emp_marcha:#76002b;
  --shadow:0 1px 2px rgba(0,20,90,.06),0 6px 20px rgba(0,20,90,.06);
  --shadow-lg:0 14px 44px rgba(0,20,90,.2);
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --blue:#7f93ff; --blue-ink:#aab6ff; --blue-soft:#1c2350; --magenta:#ff4f86; --magenta-soft:#3a1426;
    --ink:#e9ebf7; --ink-soft:#a5abc8; --line:#2b3157; --paper:#0d1127; --surface:#151a38;
    --acad:#c7a1f2; --acad-soft:#2c1d45; --emp:#aab6ff; --emp-soft:#1c2350; --lan:#6fd9bf; --lan-soft:#133a33;
    --warn-bg:#2d2412; --warn-ink:#f1d08c; --warn-line:#4a3c1c;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); --shadow-lg:0 14px 44px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --blue:#7f93ff; --blue-ink:#aab6ff; --blue-soft:#1c2350; --magenta:#ff4f86; --magenta-soft:#3a1426;
  --ink:#e9ebf7; --ink-soft:#a5abc8; --line:#2b3157; --paper:#0d1127; --surface:#151a38;
  --acad:#c7a1f2; --acad-soft:#2c1d45; --emp:#aab6ff; --emp-soft:#1c2350; --lan:#6fd9bf; --lan-soft:#133a33;
  --warn-bg:#2d2412; --warn-ink:#f1d08c; --warn-line:#4a3c1c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); --shadow-lg:0 14px 44px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.disp{font-family:'Nunito Sans','Montserrat',system-ui,sans-serif;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--blue-ink)}
:focus-visible{outline:3px solid var(--magenta);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto;padding-inline:20px}
@media(max-width:520px){.wrap{padding-inline:16px}}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand .mk{width:34px;height:34px;border-radius:8px;background:var(--blue);display:grid;place-items:center;flex:0 0 auto}
.brand .mk i{width:11px;height:11px;border-radius:50%;background:var(--magenta);display:block;box-shadow:0 0 0 3px #fff}
.brand b{display:block;font-family:'Nunito Sans','Montserrat',system-ui,sans-serif;font-weight:900;font-size:15.5px;letter-spacing:-.01em;line-height:1.1}
.brand span{font-size:11.5px;color:var(--ink-soft)}
.tabs{display:flex;gap:4px;margin-left:auto;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{border:0;background:transparent;border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:600;color:var(--ink-soft)}
.tabs button[aria-current="page"]{background:var(--blue);color:#fff}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;padding:6px 11px;font-size:12px;font-weight:700;color:var(--ink-soft)}
.lang button[aria-pressed="true"]{background:var(--magenta);color:#fff}
@media(max-width:720px){.tabs{order:3;margin-left:0;width:100%;justify-content:space-between}.tabs button{flex:1;padding-inline:6px}.lang{margin-left:auto}}

.notice{background:var(--warn-bg);border-bottom:1px solid var(--warn-line);color:var(--warn-ink);font-size:12.3px}
.notice .wrap{padding-block:7px}

.view{display:none;padding-block:34px 70px}
.view.on{display:block}

.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--magenta);margin:0 0 10px}
.h1{font-size:clamp(28px,4.6vw,46px);line-height:1.05;letter-spacing:-.02em;font-weight:900;margin:0 0 12px}
.lead{font-size:16px;color:var(--ink-soft);max-width:60ch;margin:0 0 26px}
.needs-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:24px}
@media(max-width:860px){.needs-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.needs-grid{grid-template-columns:1fr}}
.need{position:relative;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:13px;padding:14px 42px 14px 14px;display:flex;gap:12px;align-items:flex-start;transition:border-color .12s,background .12s}
.need:hover{border-color:var(--blue)}
.need .ni{width:38px;height:38px;border-radius:10px;background:var(--blue-soft);color:var(--blue-ink);display:grid;place-items:center;flex:0 0 auto}
.need .ni svg{width:20px;height:20px}
.need b{display:block;font-size:14.3px;font-weight:700;line-height:1.2}
.need small{display:block;font-size:12.2px;color:var(--ink-soft);line-height:1.3;margin-top:2px}
.need .ck{position:absolute;top:13px;right:13px;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;color:#fff}
.need .ck svg{width:12px;height:12px;opacity:0}
.need[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.need[aria-pressed="true"] .ck{background:var(--blue);border-color:var(--blue)}
.need[aria-pressed="true"] .ck svg{opacity:1}
.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:11px;padding:13px 20px;font-weight:700;font-size:14.5px;display:inline-flex;gap:9px;align-items:center}
.btn svg{width:16px;height:16px}
.btn-p{background:var(--magenta);color:#fff;box-shadow:0 6px 18px rgba(206,0,74,.25)}
.btn-p:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn-p .cnt{background:rgba(255,255,255,.25);border-radius:999px;padding:0 8px;font-size:12px}
.btn-g{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.linkish{border:0;background:none;color:var(--blue-ink);font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:4px 0;font-size:13.5px;text-align:left}
.start{margin-top:34px;display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--magenta);border-radius:12px;padding:16px 18px;max-width:760px}
.start h3{margin:0 0 4px;font-size:16.5px;font-weight:800}
.start p{margin:0;color:var(--ink-soft);font-size:13.8px}

.res-head{display:flex;gap:14px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:22px}
.res-head .h1{margin:0}
.res-sec{padding-block:22px;border-top:1px solid var(--line)}
.res-sec h2{margin:0 0 3px;font-size:21px;font-weight:900;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.res-sec h2 .ni{width:32px;height:32px;border-radius:9px;background:var(--blue-soft);color:var(--blue-ink);display:grid;place-items:center}
.res-sec h2 .ni svg{width:18px;height:18px}
.res-sec .note{margin:4px 0 14px;color:var(--ink-soft);font-size:13.6px;max-width:75ch}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.cards{grid-template-columns:1fr}}
.ecard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.ecard h3{margin:0;font-size:15.5px;font-weight:800;line-height:1.2}
.ecard p{margin:0;font-size:13px;color:var(--ink-soft)}
.ecard .meta{font-size:12.5px;display:grid;gap:3px;color:var(--ink)}
.ecard .meta span{display:flex;gap:7px;align-items:flex-start}
.ecard .meta svg{width:14px;height:14px;flex:0 0 auto;margin-top:3px;color:var(--ink-soft)}
.ecard .more{margin-top:auto;align-self:flex-start;border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:6px 11px;font-size:12.5px;font-weight:600}
.ecard .more:hover{border-color:var(--blue)}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:10.8px;font-weight:700;padding:3px 8px;border-radius:999px;letter-spacing:.01em;line-height:1.3}
.t-acad{background:var(--acad-soft);color:var(--acad)}
.t-emp{background:var(--emp-soft);color:var(--emp)}
.t-lan{background:var(--lan-soft);color:var(--lan)}
.t-door{background:var(--magenta-soft);color:var(--magenta)}
.t-orient{background:var(--warn-bg);color:var(--warn-ink)}
.also{margin-top:14px;display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.also .lbl{font-size:12.2px;font-weight:700;color:var(--ink-soft);margin-right:4px}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12.3px;font-weight:600}
.chipbtn:hover{border-color:var(--blue);color:var(--blue-ink)}
.twotypes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0 4px}
@media(max-width:640px){.twotypes{grid-template-columns:1fr}}
.tt{border-radius:13px;padding:15px 16px;border:1px solid var(--line);background:var(--surface)}
.tt h4{margin:0 0 6px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
.tt h4 i{width:10px;height:10px;border-radius:3px;display:block}
.tt p{margin:0 0 8px;font-size:13px;color:var(--ink-soft)}
.tt ul{margin:0;padding-left:18px;font-size:13px}
.tt li{margin:3px 0}
.saber{margin-top:30px;background:var(--blue);color:#fff;border-radius:16px;padding:22px 24px;display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.saber h3{margin:0 0 4px;font-size:19px;font-weight:900}
.saber p{margin:0;opacity:.85;font-size:13.5px;max-width:62ch}
.saber .btn{background:#fff;color:#001C93}

.pgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media(max-width:960px){.pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.pgrid{grid-template-columns:1fr}}
.pcard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:17px;display:flex;flex-direction:column;gap:9px;box-shadow:var(--shadow)}
.pcard:hover{border-color:var(--blue)}
.pcard .ni{width:40px;height:40px;border-radius:11px;background:var(--blue-soft);color:var(--blue-ink);display:grid;place-items:center}
.pcard .ni svg{width:21px;height:21px}
.pcard h3{margin:0;font-size:15px;font-weight:800;line-height:1.2}
.pcard p{margin:0;font-size:12.7px;color:var(--ink-soft);line-height:1.4}

.ihead{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;margin-bottom:6px}
.ihead h2{margin:0 0 3px;font-size:25px;font-weight:900;letter-spacing:-.02em}
.ihead p{margin:0;color:var(--ink-soft);max-width:72ch;font-size:13.8px}
.ihead .ctrl{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.sel{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;font:inherit;font-size:13px;color:var(--ink);max-width:100%}
.needbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:16px 0 4px;font-size:13px}
.needbar b{font-weight:700}
.needbar .sc{font-size:11.8px;padding:3px 9px;border-radius:999px;background:var(--paper);border:1px solid var(--line)}
.lbl-sm{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin:22px 0 8px}
.canvas{overflow-x:auto;padding:4px 2px 14px}
.track{display:flex;min-width:min-content}
.phase{flex:0 0 250px;padding:10px 12px;border-radius:14px;position:relative}
.phase + .phase{border-left:1px dashed var(--line)}
.phase.here{background:var(--blue-soft)}
.phase.before{opacity:.45}
.phase.active{background:var(--lan-soft)}
.ph{display:flex;gap:9px;align-items:center;margin-bottom:10px}
.ph .num{width:26px;height:26px;border-radius:8px;color:#fff;font-family:'Nunito Sans','Montserrat',system-ui,sans-serif;font-weight:900;font-size:13px;display:grid;place-items:center;flex:0 0 auto}
.ph .tt1{font-family:'Nunito Sans','Montserrat',system-ui,sans-serif;font-weight:800;font-size:14px;line-height:1.15}
.ph .kind{display:block;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft)}
.pill{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:999px;margin-bottom:8px;background:var(--blue);color:#fff}
.phase.active .pill{background:var(--lan)}
.nodes{display:flex;flex-direction:column;gap:8px}
.node{text-align:left;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--am);border-radius:10px;padding:9px 11px;display:flex;flex-direction:column;gap:5px}
.node:hover{box-shadow:var(--shadow)}
.node .nm{font-size:12.8px;font-weight:700;line-height:1.2}
.pnote{margin-top:10px;font-size:11.8px;color:var(--ink-soft);background:var(--paper);border:1px dashed var(--line);border-radius:9px;padding:8px 10px;line-height:1.4}
.pnote .linkish{font-size:11.8px;display:block;margin-top:4px}

.dir-tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.dir-tools input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit}

.scrim{position:fixed;inset:0;background:rgba(10,14,40,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.scrim.show{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;height:100%;width:min(460px,94vw);background:var(--surface);z-index:60;transform:translateX(102%);transition:transform .25s ease;box-shadow:var(--shadow-lg);display:flex;flex-direction:column}
.panel.show{transform:none}
.ptop{padding:20px 22px 14px;border-bottom:1px solid var(--line);position:relative;padding-top:calc(20px + env(safe-area-inset-top,0px))}
.ptop .ty{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.ptop h3{margin:4px 0 8px;font-size:21px;font-weight:900;line-height:1.15;padding-right:36px}
.pclose{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:16px;width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.pclose svg{width:16px;height:16px}
.pbody{overflow-y:auto;padding:16px 22px 30px;flex:1}
.fs{margin-bottom:16px}
.fs h4{margin:0 0 6px;font-family:'Montserrat',system-ui,sans-serif;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);font-weight:700}
.fs p{margin:0;font-size:13.6px}
.eibox{background:var(--blue-soft);border-radius:12px;padding:12px 14px}
.eibox h4{color:var(--blue-ink);display:flex;gap:6px;align-items:center}
.eibox h4 svg{width:14px;height:14px}
.fuera{border:1px dashed var(--line);border-radius:12px;padding:10px 14px}
.fuera summary{cursor:pointer;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.fuera p{margin-top:8px}
.crow{display:flex;gap:9px;align-items:flex-start;font-size:13.3px;margin:5px 0;user-select:text}
.crow svg{width:15px;height:15px;flex:0 0 auto;margin-top:3px;color:var(--ink-soft)}
.crow a{word-break:break-word}
.cnote{font-size:12px;color:var(--ink-soft);margin:0 0 4px}
.obox{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-ink);border-radius:10px;padding:10px 12px;font-size:12.8px}
.lbox{background:var(--lan-soft);color:var(--lan);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600}

.foot{border-top:1px solid var(--line);color:var(--ink-soft);font-size:12px}
.foot .wrap{padding-block:22px 34px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><div class="mk" aria-hidden="true"><i></i></div><div><b data-t="brand"></b><span data-t="brandsub"></span></div></div>
    <nav class="tabs" id="tabs">
      <button id="tab-needs" data-view="needs" data-t="tabNeeds"></button>
      <button id="tab-itin" data-view="itin" data-t="tabItin"></button>
      <button id="tab-dir" data-view="dir" data-t="tabDir"></button>
    </nav>
    <div class="lang" role="group" id="langgrp">
      <button id="lang-es" data-lang="es" aria-pressed="true" lang="es">ES</button>
      <button id="lang-eu" data-lang="eu" aria-pressed="false" lang="eu">EU</button>
    </div>
  </div>
</header>
<div class="notice"><div class="wrap"><span data-t="notice"></span> <b id="live-status"></b></div></div>

<main>
  <section class="view wrap" id="v-needs">
    <p class="eyebrow" data-t="eyebrow"></p>
    <h1 class="h1" data-t="needsQ"></h1>
    <p class="lead" data-t="needsLead"></p>
    <div class="needs-grid" id="needs-grid"></div>
    <div class="actions">
      <button class="btn btn-p" id="go-result"><span data-t="seeWhere"></span><span class="cnt" id="cnt" hidden></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
      <button class="linkish" id="go-profiles" data-t="preferSituation"></button>
    </div>
    <div class="start"><div><h3 data-t="startQ"></h3><p id="start-txt"></p></div></div>
  </section>

  <section class="view wrap" id="v-result">
    <div class="res-head">
      <div><p class="eyebrow" data-t="resEyebrow"></p><h1 class="h1" data-t="resTitle"></h1></div>
      <button class="btn btn-g" id="back-needs" data-t="changeNeeds"></button>
    </div>
    <div id="res-body"></div>
    <div class="saber">
      <div><h3 data-t="saberT"></h3><p data-t="saberP"></p></div>
      <button class="btn" id="go-itin" data-t="saberBtn"></button>
    </div>
  </section>

  <section class="view wrap" id="v-profiles">
    <p class="eyebrow" data-t="profEyebrow"></p>
    <h1 class="h1" data-t="profQ"></h1>
    <p class="lead" data-t="profLead"></p>
    <div class="pgrid" id="pgrid"></div>
  </section>

  <section class="view wrap" id="v-itin">
    <div class="ihead">
      <div><h2 id="itin-title"></h2><p id="itin-desc"></p></div>
      <div class="ctrl"><select class="sel" id="profile-sel"></select></div>
    </div>
    <div class="needbar" id="needbar" hidden></div>
    <p class="lbl-sm" data-t="trunk"></p>
    <div class="canvas"><div class="track" id="track"></div></div>
    <div id="sup-wrap">

function eibarText(a){
  if(a.eibar_live){ return LANG==='es'?a.eibar_live:(a.eibar_eu||''); }
  return L(a,'eibar');
}
function fueraText(a){
  if(a.fuera_live){ return LANG==='es'?a.fuera_live:(a.fuera_eu||''); }
  return L(a,'fuera');
}
function resumen(a){ return L(a,'resumen') || (LANG==='es'?(a.eibar_live||''):''); }

function tagsHTML(a){
  if(!a.real) return `<span class="tag t-orient">${t('orientTag')}</span>`;
  let h=a.nuevo?`<span class="tag t-orient">${t('newEnt')}</span>`:'';
  if((a.orient||[]).includes('academica')) h+=`<span class="tag t-acad">${t('acad')}</span>`;
  if((a.orient||[]).includes('empleo')) h+=`<span class="tag t-emp">${t('emp')}</span>`;
  if(a.lanbide==='general') h+=`<span class="tag t-lan">${t('lanGeneral')}</span>`;
  if(a.lanbide==='cercano') h+=`<span class="tag t-lan">${t('lanCercano')}</span>`;
  return h;
}

function ecard(id,needId){
  const a=E[id]; if(!a) return '';
  const tj=needId&&NB[needId]&&NB[needId].tarjetas&&NB[needId].tarjetas[id];
  const txt=tj?(tj[LANG]||''):resumen(a);
  return `<article class="ecard">
    <h3>${esc(nombre(id))}</h3>
    <div class="tags">${tagsHTML(a)}</div>
    ${txt?`<p>${esc(txt)}</p>`:''}
    ${a.real?`<div class="meta">
      ${L(a,'dir')?`<span>${svg('pin')}${esc(L(a,'dir'))}</span>`:''}

function parseCSV(txt){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<txt.length;i++){const c=txt[i];
    if(q){ if(c==='"'){ if(txt[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true; else if(c===','){row.push(f);f='';}
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&txt[i+1]==='\n') i++; row.push(f);f=''; if(row.some(x=>x.trim()))rows.push(row); row=[]; }
    else f+=c; }
  row.push(f); if(row.some(x=>x.trim()))rows.push(row); return rows;
}
const titleIfCaps=s=>(s&&s===s.toUpperCase()&&/[A-ZÑ]{4}/.test(s))?s.toLowerCase().replace(/(^|[\s,(/-])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase()):s;
const cWeb=s=>{const m=String(s).match(/(https?:\/\/)?[\w-]+(\.[\w-]+)+(\/[^\s)]*)?/i);return m?m[0].replace(/^https?:\/\//i,'').replace(/\/$/,''):''};
const cDir=s=>titleIfCaps(String(s).trim()).replace(/\s*\(?gipuzkoa\)?/ig,'').replace(/\b20600\b/g,'').replace(/[\s,.-]*eibar$/i,'').replace(/[\s,.-]+$/,'').replace(/\s{2,}/g,' ').trim();
function cAcc(s){const n=nrm(s),a=[]; if(/libre/.test(n))a.push('libre'); if(/cita/.test(n))a.push('cita'); if(/deriv/.test(n))a.push('deriv'); return a;}

  delete E[k];
  NEEDS.forEach(n=>{n.principal=n.principal.filter(x=>x!==k); n.tambien=n.tambien.filter(x=>x!==k);});
  Object.values(FASES).forEach(f=>f.agentes=f.agentes.filter(x=>x!==k));
  PERF.forEach(p=>p.destacados&&Object.keys(p.destacados).forEach(f=>p.destacados[f]=p.destacados[f].filter(x=>x!==k)));
}

function needsFrom(c){
  const n=k=>nrm(c[k]),out=new Set();
  if(/buscar|mejorar|orientacion laboral|intermedia/.test(n('emp'))) out.add('trabajo');
  if(/emprend/.test(n('emp'))) out.add('emprender');
  if(/castellano|euskera/.test(n('for'))) out.add('idioma');
  if(/basica|homolog/.test(n('for'))) out.add('estudiar');
  if(/profesional|digital|certific|para el empleo|para la busqueda/.test(n('for'))) out.add('curso');
  if(/informacion y orientacion/.test(n('apo'))) out.add('orientarme');
  if(/redes|acompan/.test(n('apo'))) out.add('apoyosocial');
  if(/ayudas econ/.test(n('ayu'))) out.add('ingresos');
  if(/administrativ/.test(n('ayu'))) out.add('papeles');
  if(n('viv')) out.add('vivienda'); if(n('sal')) out.add('salud'); if(n('cui')) out.add('cuidados');
  return [...out];
}

function applyLive(rows){
  const H=rows[0].map(h=>String(h).replace(/\s+/g,' ').trim());
  const col=(test)=>H.findIndex(test);
  const C={nom:1,web:col(h=>/p[aá]gina web/i.test(h)),dir:col(h=>/direcci[oó]n completa/i.test(h)),
    tipo:col(h=>/describa vuestra organizaci|selecciona la opci/i.test(h)),desc:col(h=>/describa brevemente/i.test(h)),
    emp:col(h=>h==='ENPLEGUA // EMPLEO'),for:col(h=>h==='PRESTAKUNTZA // FORMACIÓN'),apo:col(h=>h==='GIZARTE-LAGUNTZA // APOYO SOCIAL'),
    ayu:col(h=>/^LAGUNTZA EKONOMIKOAK/.test(h)),viv:col(h=>h==='ETXEBIZITZA // VIVIENDA'),sal:col(h=>h==='OSASUNA // SALUD'),
    cui:col(h=>/^ZAINTZA ETA KONTZILIAZIOA/.test(h)),acc:col(h=>/forma de acceso/i.test(h)),
    bj:col(h=>/EN EIBAR$/i.test(h)&&!/FUERA/i.test(h)),bk:col(h=>/FUERA DE EIBAR/i.test(h))};
  const g=(r,k)=>C[k]>=0?String(r[C[k]]??'').trim():'';
  const seen=new Set(); let nuevos=0, n=0;
  rows.slice(1).forEach(r=>{
    const nom=g(r,'nom'); if(!nom) return; n++;
    const hit=MATCH.find(([k,re])=>!seen.has(k)&&re.test(nrm(nom)));
    let id=hit&&hit[0], a;
    if(id){ seen.add(id); if(OCULTAS.has(id)) return; a=E[id]; if(!a) return; }
    else {
      id='nueva'+(++nuevos); if(OCULTAS.has(id)) return;
      const tipo=g(r,'tipo');
      a=E[id]={real:true,excel:true,nuevo:true,puerta:false,nombre_es:titleIfCaps(nom),nombre_eu:titleIfCaps(nom),
        tipo_es:bilingue(tipo,'es'),tipo_eu:bilingue(tipo,'eu'),orient:g(r,'emp')?['empleo']:[],acceso:[],
        resumen_es:'',resumen_eu:'',eibar_live:g(r,'bj')||g(r,'desc'),web:cWeb(g(r,'web'))};
      const d=cDir(g(r,'dir')); a.dir_es=d; a.dir_eu=d;
      const svc={emp:g(r,'emp'),for:g(r,'for'),apo:g(r,'apo'),ayu:g(r,'ayu'),viv:g(r,'viv'),sal:g(r,'sal'),cui:g(r,'cui')};
      needsFrom(svc).forEach(nid=>{const ne=NB[nid]; if(ne&&!ne.tambien.includes(id)&&!ne.principal.includes(id)) ne.tambien.push(id);});
      const FA={emp:'orientlab',for:'formacion',apo:'apoyo',ayu:'prestaciones',viv:'vivienda',sal:'salud',cui:'apoyo'};
      Object.keys(FA).forEach(k=>{ if(svc[k]){ const f=FA[k]; if(!FASES[f].agentes.includes(id)) FASES[f].agentes.push(id);} });
    }
    const acc=cAcc(g(r,'acc')); if(acc.length && !a.acceso_fijo) a.acceso=acc;
    const bj=g(r,'bj'), bk=g(r,'bk');
    if(!a.nuevo){
      if(bj && a.src_bj!=null && nrm(bj)!==nrm(a.src_bj)) a.eibar_live=bj;
      if(bk && a.src_bk!=null && nrm(bk)!==nrm(a.src_bk)) a.fuera_live=bk;
    }
  });
  /* Entidades que salían del Excel y ya no están: se retiran (las derivadas, como Harreragunea, se mantienen). */
  Object.keys(E).forEach(k=>{ if(E[k].excel && !E[k].nuevo && !seen.has(k)) quitarEntidad(k); });
  return n;
}

/* ---------- CORRECCIONES ----------
   Columnas: ID | ENTIDAD | ACCIÓN | CAMPO | VALOR (castellano) | VALOR (euskera) | MOTIVO | QUIÉN LO PIDE | FECHA | ACTIVA
   ACCIÓN: corregir · ocultar · desdoblar · añadir · quitar */
const CAMPOS_TXT=['nombre','tipo','resumen','eibar','fuera','dir','horario','contacto'];
const CAMPOS_ALIAS={'en eibar':'eibar','en_eibar':'eibar','eibarren':'eibar','fuera de eibar':'fuera','fuera':'fuera','direccion':'dir','dirección':'dir','descripcion':'resumen','descripción':'resumen','telefono':'tel','teléfono':'tel','correo':'email','e-mail':'email'};
function applyCorrecciones(rows){
  if(!rows||rows.length<2) return 0;
  const H=rows[0].map(h=>nrm(h));
  const ix=(re,def)=>{const i=H.findIndex(h=>re.test(h)); return i>=0?i:def;};
  const I={ent:ix(/^entidad/,1),acc:ix(/^accion/,2),campo:ix(/^campo/,3),es:ix(/castellano|^valor$|valor es/,4),eu:ix(/euskera|valor eu/,5),act:ix(/^activa/,9)};
  let n=0;
  rows.slice(1).forEach((r,i)=>{
    const v=k=>String(r[I[k]]??'').trim();
    if(/^(no|ez|0|false)$/i.test(v('act'))) return;
    const ent=nrm(v('ent')).replace(/\s+/g,''), acc=nrm(v('acc')), es=v('es'), eu=v('eu');
    let campo=nrm(v('campo')); campo=CAMPOS_ALIAS[campo]||campo;
    if(!ent||!acc) return;
    const aviso=m=>LIVE.avisos.push(`Fila ${i+2}: ${m}`);
    if(ent.startsWith('necesidad:')){
      const ne=NB[ent.split(':')[1]]; if(!ne){aviso('necesidad desconocida');return;}
      if(campo==='nota'){ if(es) ne.nota_es=es; if(eu) ne.nota_eu=eu; n++; }
      else if(campo==='subtitulo'){ if(es) ne.sub_es=es; if(eu) ne.sub_eu=eu; n++; }
      else aviso('campo de necesidad desconocido');
      return;
    }
    if(acc==='ocultar'){
      if(!campo){ OCULTAS.add(ent); if(E[ent]) quitarEntidad(ent); n++; }
      else if(E[ent]){ if(CAMPOS_TXT.includes(campo)){E[ent][campo+'_es']='';E[ent][campo+'_eu']='';} else E[ent][campo]=''; n++; }
      return;
    }
    if(acc==='desdoblar'){
      const src=E[ent], nid=campo.replace(/\s+/g,'');
      if(!src){aviso('entidad origen desconocida');return;}
      if(!E[nid]) E[nid]={real:true,excel:false,puerta:false,derivado_de:ent,tipo_es:src.tipo_es,tipo_eu:src.tipo_eu,web:src.web,acceso:[...(src.acceso||[])],orient:[],
        nombre_es:es||nid,nombre_eu:eu||es||nid,resumen_es:'',resumen_eu:'',eibar_es:'',eibar_eu:''};
      n++; return;
    }
    if(acc==='anadir'||acc==='añadir'){
      if(!E[ent]) E[ent]={real:true,excel:false,puerta:false,acceso:[],orient:[],nombre_es:ent,nombre_eu:ent,resumen_es:'',resumen_eu:'',eibar_es:'',eibar_eu:''};
      const a=E[ent];
      if(campo.startsWith('necesidad')){ const [nid,tipo]=es.split(':').map(x=>nrm(x)); const ne=NB[nid];
        if(!ne){aviso('necesidad desconocida');return;}
        const lst=tipo==='principal'?ne.principal:ne.tambien; if(!ne.principal.includes(ent)&&!ne.tambien.includes(ent)) lst.push(ent); n++; return; }
      if(campo==='fase'){ const f=FASES[nrm(es)]; if(!f){aviso('fase desconocida');return;} if(!f.agentes.includes(ent)) f.agentes.push(ent); n++; return; }
      if(!campo){ n++; return; }
      /* sigue como «corregir» */
    }
    if(acc==='quitar'){
      const [tipo,ref]=es.split(':').map(x=>nrm(x));
      if(tipo==='necesidad'&&NB[ref]){ NB[ref].principal=NB[ref].principal.filter(x=>x!==ent); NB[ref].tambien=NB[ref].tambien.filter(x=>x!==ent); n++; }
      else if(tipo==='fase'&&FASES[ref]){ FASES[ref].agentes=FASES[ref].agentes.filter(x=>x!==ent); n++; }
      else aviso('«quitar» necesita «necesidad:id» o «fase:id» en el valor');
      return;
    }
    const a=E[ent]; if(!a){aviso(`entidad «${ent}» desconocida`);return;}
    if(CAMPOS_TXT.includes(campo)){
      if(es) a[campo+'_es']=es; if(eu) a[campo+'_eu']=eu;
      if(campo==='eibar'&&(es||eu)) delete a.eibar_live;
      if(campo==='fuera'&&(es||eu)) delete a.fuera_live;
      n++;
    } else if(['tel','email','web'].includes(campo)){ a[campo]=es; n++; }
    else if(campo==='acceso'){ a.acceso=cAcc(es); a.acceso_fijo=true; n++; }
    else if(campo.startsWith('tarjeta:')){ const ne=NB[campo.split(':')[1]]; if(!ne){aviso('necesidad desconocida');return;}
      ne.tarjetas=ne.tarjetas||{}; ne.tarjetas[ent]={es,eu:eu||''}; n++; }
    else aviso(`campo «${campo}» desconocido`);
  });
  return n;
}

/* ---------- lectura ---------- */
async function viaFetch(url){
  const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),10000);
  try{ const res=await fetch(url,{signal:ctl.signal}); if(!res.ok) throw new Error('HTTP '+res.status); return parseCSV(await res.text()); }
  finally{ clearTimeout(to); }
}
function viaJSONP(extra){
  return new Promise((resolve,reject)=>{
    const cb='__ibil'+Date.now()+Math.floor(Math.random()*1e4); const sc=document.createElement('script');
    const to=setTimeout(()=>{cleanup();reject(new Error('timeout jsonp'))},12000);
    function cleanup(){clearTimeout(to);delete window[cb];sc.remove();}
    window[cb]=resp=>{cleanup();
      try{ if(resp.status==='error') throw new Error((resp.errors||[]).map(e=>e.detailed_message||e.message).join('; '));
        const tb=resp.table; const head=tb.cols.map(c=>c.label||'');
        const rows=[head,...tb.rows.map(r=>(r.c||[]).map(c=>c?(c.f!=null?c.f:(c.v!=null?String(c.v):'')):''))];
        resolve(rows);}catch(e){reject(e);} };
    sc.onerror=()=>{cleanup();reject(new Error('script bloqueado'))};
    sc.src=GVIZ+'?headers=1&tqx=responseHandler:'+cb+extra+'&t='+Date.now();
    document.head.appendChild(sc);
  });
}
const okRows=r=>r && r.length>=2 && /marca temporal/i.test(r[0][0]||'');
async function leerRespuestas(){
  const intentos=[['csv-publicado',()=>viaFetch(SHEET_CSV)],['jsonp-gviz',()=>viaJSONP('&gid=0')],['csv-gviz',()=>viaFetch(GVIZ+'?tqx=out:csv&headers=1&gid=0')]];
  for(const [nombre,fn] of intentos){
    try{ const rows=await fn(); if(!okRows(rows)) throw new Error('formato inesperado'); return rows; }
    catch(err){ console.warn('Respuestas no disponibles vía',nombre,err); }
  }
  return null;
}
/* La pestaña se busca con varios nombres (mayúsculas/minúsculas). Debe tener las columnas separadas:
   si todo está en una sola columna (CSV pegado sin separar), NO se aplica y se avisa en la franja amarilla. */
const NOMBRES_CORR=['CORRECCIONES','correcciones','Correcciones','ZUZENKETAK','zuzenketak'];
function esCorrecciones(rows){
  if(!rows||!rows[0]) return 'no';
  const h=rows[0].map(x=>nrm(x));
  if(h.some(x=>/^accion\b/.test(x)) && h.some(x=>/^entidad\b/.test(x))) return 'ok';
  if(h.length<=2 && /id,entidad,acci/.test(h.join(','))) return 'una-columna';
  return 'no';
}
async function leerCorrecciones(){
  let formato=null;
  for(const nom of NOMBRES_CORR){
    const s='&sheet='+encodeURIComponent(nom);
    for(const [via,fn] of [['jsonp-gviz',()=>viaJSONP(s)],['csv-gviz',()=>viaFetch(GVIZ+'?tqx=out:csv&headers=1'+s)]]){
      try{ const rows=await fn(); const e=esCorrecciones(rows);
        if(e==='ok'){ LIVE.corr='ok'; return rows; }
        if(e==='una-columna'){ formato='una-columna'; break; }
        break; /* respondió otra pestaña (Google devuelve la primera si el nombre no existe): probar el siguiente nombre */
      }catch(err){ console.warn('Correcciones no disponibles vía',via,nom,err); }
    }
  }
  LIVE.corr=formato||'no';
  return null;
}
async function loadLive(){
  if(window.__TEST_ROWS){ const c=window.__TEST_CORR||null; const e=esCorrecciones(c); LIVE.corr=e==='ok'?'ok':(e==='una-columna'?'una-columna':'no'); return finish(window.__TEST_ROWS, e==='ok'?c:null); }
  const [rows,corr]=await Promise.all([leerRespuestas(),leerCorrecciones()]);
  finish(rows,corr);
}
function finish(rows,corr){
  if(!rows){ LIVE.state='fail'; render(); return; }
  /* Primero las ocultaciones de CORRECCIONES, para no crear como «nuevas» las entidades ocultas. */
  if(corr) corr.slice(1).forEach(r=>{ if(/ocultar/i.test(r[2]||'')&&!String(r[3]||'').trim()) OCULTAS.add(nrm(r[1]).replace(/\s+/g,'')); });
  const n=applyLive(rows);
  const nc=corr?applyCorrecciones(corr):null;
  const now=new Date(), pad=x=>String(x).padStart(2,'0');
  DATA.meta.respuestas=n;
  DATA.meta.actualizado=`${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()}`;
  LIVE.state='ok'; LIVE.n=n; LIVE.nc=nc; LIVE.hora=`${pad(now.getHours())}:${pad(now.getMinutes())}`;
  if(LIVE.avisos.length) console.warn('Correcciones no aplicadas:\n'+LIVE.avisos.join('\n'));
  render();
}

try{const s=localStorage.getItem('ibil-lang'); if(s==='eu'||s==='es'){LANG=s;document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===LANG)));}}catch(_){}
const h0=(location.hash||'').slice(1); if(['needs','itin','dir','profiles'].includes(h0)) VIEW=h0;
setView(VIEW);
loadLive();
