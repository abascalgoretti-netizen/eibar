<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>Itinerarios de inclusión · Eibar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wdth,wght@75..125,700..1000&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#001C93; --blue-ink:#001C93; --blue-2:#0a2aa8; --blue-soft:#e8ebfa; --magenta:#CE004A; --magenta-ink:#CE004A; --pink:#ff8db4; --magenta-soft:#fbe6ee;
  --ink:#1b1e33; --ink-soft:#4d5170; --line:#e1e3ec; --paper:#ffffff; --card:#f3f3f6; --surface:#ffffff;
  --lan:#0b6b58; --lan-soft:#e3f4ef; --acad:#6a2fa8; --acad-soft:#f1e9fa;
  --warn-bg:#fff6e5; --warn-ink:#7a5410; --warn-line:#f0dfb8;
  --am-acogida:#5a6385; --am-diagnostico:#3b3fb5; --am-formacion:#6a2fa8; --am-orientlab:#001C93; --am-empleo:#CE004A;
  --am-seguimiento:#2f6f86; --am-prestaciones:#a8680f; --am-apoyo:#0b7a6c; --am-salud:#2d8249; --am-vivienda:#855634;
  --am-emp_idea:#CE004A; --am-emp_aseso:#a3003b; --am-emp_marcha:#76002b;
  --shadow:0 1px 2px rgba(0,20,90,.05),0 6px 18px rgba(0,20,90,.06); --shadow-lg:0 14px 44px rgba(0,20,90,.22);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --blue:#7f93ff; --blue-ink:#aab6ff; --blue-2:#1a2a7a; --blue-soft:#1c2350; --magenta:#ff4f86; --magenta-ink:#ff7aa5; --magenta-soft:#3a1426;
    --ink:#e9ebf7; --ink-soft:#a5abc8; --line:#2b3157; --paper:#0d1127; --card:#171c3b; --surface:#151a38;
    --lan:#6fd9bf; --lan-soft:#133a33; --acad:#c7a1f2; --acad-soft:#2c1d45;
    --warn-bg:#2d2412; --warn-ink:#f1d08c; --warn-line:#4a3c1c;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); --shadow-lg:0 14px 44px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --blue:#7f93ff; --blue-ink:#aab6ff; --blue-2:#1a2a7a; --blue-soft:#1c2350; --magenta:#ff4f86; --magenta-ink:#ff7aa5; --magenta-soft:#3a1426;
  --ink:#e9ebf7; --ink-soft:#a5abc8; --line:#2b3157; --paper:#0d1127; --card:#171c3b; --surface:#151a38;
  --lan:#6fd9bf; --lan-soft:#133a33; --acad:#c7a1f2; --acad-soft:#2c1d45;
  --warn-bg:#2d2412; --warn-ink:#f1d08c; --warn-line:#4a3c1c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); --shadow-lg:0 14px 44px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
.disp,h1,h2{font-family:'Nunito Sans','Montserrat',system-ui,sans-serif;font-stretch:125%;font-weight:900;text-wrap:balance}
h3,h4{font-family:'Montserrat',system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--blue-ink)}
:focus-visible{outline:3px solid var(--magenta);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto;padding-inline:20px}
@media(max-width:520px){.wrap{padding-inline:16px}}

/* cabecera con los dos logos en igualdad */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.logos{display:flex;align-items:center;gap:10px}
.logo{height:56px;display:flex;align-items:center;background:#fff;border-radius:10px;padding:6px 10px}
.logo img{height:44px;width:auto;display:block}
.brandtxt{font-size:12px;color:var(--ink-soft);line-height:1.25;max-width:26ch}
.brandtxt b{display:block;color:var(--ink);font-family:'Nunito Sans','Montserrat',sans-serif;font-stretch:125%;font-weight:900;font-size:14px}
.tabs{display:flex;gap:4px;margin-left:auto;background:var(--card);border-radius:999px;padding:3px}
.tabs button{border:0;background:transparent;border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:700;color:var(--ink-soft)}
.tabs button[aria-current="page"]{background:var(--blue);color:#fff}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;padding:7px 11px;font-size:12px;font-weight:800;color:var(--ink-soft)}
.lang button[aria-pressed="true"]{background:var(--magenta);color:#fff}
@media(max-width:820px){.brandtxt{display:none}}
@media(max-width:720px){.tabs{order:3;margin-left:0;width:100%;justify-content:space-between}.tabs button{flex:1;padding-inline:6px}.lang{margin-left:auto}.logo{height:46px;padding:5px 8px}.logo img{height:34px}}

.notice{background:var(--warn-bg);border-bottom:1px solid var(--warn-line);color:var(--warn-ink);font-size:12.3px}
.notice .wrap{padding-block:7px}
.view{display:none;padding-block:0 70px}
.view.on{display:block}

.kicker{font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--magenta-ink);margin:0 0 8px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:currentColor;margin-right:8px;vertical-align:1px}
.h1{font-size:clamp(28px,4.4vw,46px);line-height:1.08;letter-spacing:-.005em;margin:0 0 12px;color:var(--blue-ink)}
.lead{font-size:16px;color:var(--ink-soft);max-width:62ch;margin:0 0 24px}

/* portada estilo díptico */
.hero{background:#001C93;color:#fff}
.hero .wrap{display:grid;grid-template-columns:1.25fr 1fr;gap:34px;padding-block:40px 44px;align-items:center}
@media(max-width:860px){.hero .wrap{grid-template-columns:1fr;gap:22px;padding-block:28px 30px}}
.hero .kicker{color:var(--pink)}
.hero .h1{color:#fff}
.hero .lead{color:#dfe4ff;margin:0}
.startbox{background:#0a2aa8;border-radius:14px;padding:18px 20px}
.startbox h3{margin:0 0 10px;font-size:16.5px;font-weight:800;color:#fff}
.startbox .it{display:block;width:100%;text-align:left;background:transparent;border:0;padding:7px 0;color:#fff;border-top:1px solid rgba(255,255,255,.14)}
.startbox .it:first-of-type{border-top:0}
.startbox .it b{display:block;font-size:14px}
.startbox .it span{display:block;font-size:13px;color:#dfe4ff}
.startbox .it small{display:inline-flex;gap:6px;align-items:center;font-weight:700;color:var(--pink);font-size:12.5px;margin-top:2px}
.startbox .it small svg{width:13px;height:13px}
.sec{padding-top:30px}
.needs-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:22px}
@media(max-width:860px){.needs-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.needs-grid{grid-template-columns:1fr}}
.need{position:relative;text-align:left;background:var(--card);border:2px solid transparent;border-radius:12px;padding:13px 42px 13px 13px;display:flex;gap:12px;align-items:flex-start}
.need:hover{border-color:var(--blue)}
.need .ni{width:38px;height:38px;border-radius:10px;background:var(--surface);color:var(--blue-ink);display:grid;place-items:center;flex:0 0 auto}
.need .ni svg{width:20px;height:20px}
.need b{display:block;font-size:14.3px;font-weight:800;line-height:1.2}
.need small{display:block;font-size:12.2px;color:var(--ink-soft);line-height:1.3;margin-top:2px}
.need .ck{position:absolute;top:13px;right:13px;width:20px;height:20px;border-radius:6px;border:1.5px solid #c5c9d8;display:grid;place-items:center;color:#fff;background:var(--surface)}
.need .ck svg{width:12px;height:12px;opacity:0}
.need[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.need[aria-pressed="true"] .ck{background:var(--blue);border-color:var(--blue)}
.need[aria-pressed="true"] .ck svg{opacity:1}
.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:11px;padding:13px 20px;font-weight:800;font-size:14.5px;display:inline-flex;gap:9px;align-items:center}
.btn svg{width:16px;height:16px}
.btn-p{background:var(--magenta);color:#fff}
.btn-p:disabled{opacity:.45;cursor:not-allowed}
.btn-p .cnt{background:rgba(255,255,255,.25);border-radius:999px;padding:0 8px;font-size:12px}
.btn-g{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.linkish{border:0;background:none;color:var(--blue-ink);font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:4px 0;font-size:13px;text-align:left}
.antes{margin-top:30px;border:1.5px solid var(--magenta);border-radius:12px;padding:14px 18px;max-width:640px}
.antes h3{margin:0 0 4px;color:var(--magenta-ink);font-size:15.5px;font-weight:800}
.antes p{margin:0;color:var(--ink-soft);font-size:13.8px}

/* tarjetas tipo díptico */
.res-head{display:flex;gap:14px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin:30px 0 18px}
.res-head .h1{margin:0}
.res-sec{padding-block:20px;border-top:1px solid var(--line)}
.res-sec h2{margin:0 0 4px;font-size:21px;display:flex;align-items:center;gap:10px;color:var(--blue-ink)}
.res-sec h2 .ni{width:32px;height:32px;border-radius:9px;background:var(--blue-soft);color:var(--blue-ink);display:grid;place-items:center}
.res-sec h2 .ni svg{width:18px;height:18px}
.res-sec .note{margin:4px 0 14px;color:var(--ink-soft);font-size:13.6px;max-width:80ch}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.cards{grid-template-columns:1fr}}
.cards.two{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:700px){.cards.two{grid-template-columns:1fr}}
.ecard{background:var(--card);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:5px}
.ecard h3{margin:0;font-size:14.5px;font-weight:800;line-height:1.25}
.ecard p{margin:0;font-size:13px;color:var(--ink-soft)}
.contact{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:13px;font-weight:700;color:var(--c,var(--blue-ink));margin-top:2px}
.contact span,.contact a{display:inline-flex;gap:5px;align-items:center;color:inherit;text-decoration:none}
.contact svg{width:13px;height:13px;flex:0 0 auto}
.ecard .more{margin-top:4px;align-self:flex-start;border:0;background:none;padding:2px 0;font-size:12.5px;font-weight:700;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px}
.c-magenta{--c:var(--magenta-ink)} .c-blue{--c:var(--blue-ink)}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:10.8px;font-weight:800;padding:3px 8px;border-radius:999px;line-height:1.3}
.t-acad{background:var(--acad-soft);color:var(--acad)} .t-emp{background:var(--blue-soft);color:var(--blue-ink)}
.t-lan{background:var(--lan-soft);color:var(--lan)} .t-door{background:var(--magenta-soft);color:var(--magenta-ink)} .t-orient{background:var(--warn-bg);color:var(--warn-ink)}
.also{margin-top:12px;display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.also .lbl{font-size:12.2px;font-weight:800;color:var(--ink-soft);margin-right:4px}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12.3px;font-weight:700}
.chipbtn:hover{border-color:var(--blue);color:var(--blue-ink)}
.saber{margin-top:28px;background:#001C93;color:#fff;border-radius:16px;padding:22px 24px;display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.saber h3{margin:0 0 4px;font-size:18px;font-weight:800}
.saber p{margin:0;color:#dfe4ff;font-size:13.5px;max-width:62ch}
.saber .btn{background:#fff;color:#001C93}

/* directorio */
.cat{margin-top:26px}
.cat h2{font-family:'Montserrat',sans-serif;font-stretch:100%;font-size:13.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin:0 0 10px}
.cat.magenta h2{color:var(--magenta-ink)} .cat.blue h2{color:var(--blue-ink)}
.dir-tools{display:flex;gap:10px;margin:0 0 6px}
.dir-tools input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit}

/* itinerario */
.seg{display:inline-flex;background:var(--card);border-radius:999px;padding:3px;gap:3px;margin:6px 0 4px}
.seg button{border:0;background:transparent;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:800;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--magenta);color:#fff}
.ihead h2{margin:0 0 4px;font-size:26px;color:var(--blue-ink)}
.ihead p{margin:0;color:var(--ink-soft);max-width:75ch;font-size:13.8px}
.needbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--card);border-radius:12px;padding:10px 14px;margin:16px 0 4px;font-size:13px}
.needbar .sc{font-size:11.8px;padding:3px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.lbl-sm{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin:22px 0 8px}
.canvas{overflow-x:auto;padding:4px 2px 14px}
.track{display:flex;min-width:min-content}
.phase{flex:0 0 250px;padding:10px 12px;border-radius:14px}
.phase + .phase{border-left:1px dashed var(--line)}
.phase.here{background:var(--blue-soft)} .phase.before{opacity:.45} .phase.active{background:var(--lan-soft)}
.ph{display:flex;gap:9px;align-items:center;margin-bottom:10px}
.ph .num{width:26px;height:26px;border-radius:8px;color:#fff;font-weight:900;font-size:13px;display:grid;place-items:center;flex:0 0 auto}
.ph .tt1{font-weight:800;font-size:14px;line-height:1.15}
.ph .kind{display:block;font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft)}
.pill{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:999px;margin-bottom:8px;background:var(--blue);color:#fff}
.phase.active .pill{background:var(--lan)}
.nodes{display:flex;flex-direction:column;gap:8px}
.node{text-align:left;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--am);border-radius:10px;padding:9px 11px;display:flex;flex-direction:column;gap:5px}
.node:hover{box-shadow:var(--shadow)}
.node .nm{font-size:12.8px;font-weight:800;line-height:1.2}
.pnote{margin-top:10px;font-size:11.8px;color:var(--ink-soft);background:var(--card);border-radius:9px;padding:8px 10px;line-height:1.4}
.pnote .linkish{font-size:11.8px;display:block;margin-top:4px}

/* ficha */
.scrim{position:fixed;inset:0;background:rgba(10,14,40,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.scrim.show{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;height:100%;width:min(460px,94vw);background:var(--surface);z-index:60;transform:translateX(102%);transition:transform .25s ease,visibility .25s;box-shadow:var(--shadow-lg);display:flex;flex-direction:column}
.panel{visibility:hidden}.panel.show{transform:none;visibility:visible}
.ptop{padding:20px 22px 14px;border-bottom:1px solid var(--line);position:relative;padding-top:calc(20px + env(safe-area-inset-top,0px))}
.ptop .ty{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--magenta-ink)}
.ptop h3{margin:4px 0 8px;font-size:20px;font-weight:800;line-height:1.2;padding-right:36px;color:var(--blue-ink)}
.pclose{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:16px;width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.pclose svg{width:16px;height:16px}
.pbody{overflow-y:auto;padding:16px 22px 30px;flex:1}
.fs{margin-bottom:16px}
.fs h4{margin:0 0 6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);font-weight:800}
.fs p{margin:0;font-size:13.6px}
.eibox{background:var(--card);border-radius:12px;padding:12px 14px}
.eibox h4{color:var(--blue-ink);display:flex;gap:6px;align-items:center}
.eibox h4 svg{width:14px;height:14px}
.fuera{border:1px dashed var(--line);border-radius:12px;padding:10px 14px}
.fuera summary{cursor:pointer;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.fuera p{margin-top:8px}
.crow{display:flex;gap:9px;align-items:flex-start;font-size:13.3px;margin:5px 0;user-select:text}
.crow svg{width:15px;height:15px;flex:0 0 auto;margin-top:3px;color:var(--ink-soft)}
.obox{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-ink);border-radius:10px;padding:10px 12px;font-size:12.8px}
.cnote{font-size:12px;color:var(--ink-soft);margin:6px 0 0}

.foot{border-top:1px solid var(--line);color:var(--ink-soft);font-size:12px}
.foot .wrap{padding-block:22px 34px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.foot .logos{flex:0 0 auto}
.foot p{margin:0;flex:1;min-width:240px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">

function parseCSV(txt){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<txt.length;i++){const c=txt[i];
    if(q){ if(c==='"'){ if(txt[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true; else if(c===','){row.push(f);f='';}
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&txt[i+1]==='\n') i++; row.push(f);f=''; if(row.some(x=>x.trim()))rows.push(row); row=[]; }
    else f+=c; }
  row.push(f); if(row.some(x=>x.trim()))rows.push(row); return rows;
}
const titleIfCaps=s=>(s&&s===s.toUpperCase()&&/[A-ZÑ]{4}/.test(s))?s.toLowerCase().replace(/(^|[\s,(/-])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase()):s;
const cWeb=s=>{const m=String(s).match(/(https?:\/\/)?[\w-]+(\.[\w-]+)+(\/[^\s)]*)?/i);return m?m[0].replace(/^https?:\/\//i,'').replace(/\/$/,''):''};
const cDir=s=>titleIfCaps(String(s).trim()).replace(/\s*\(?gipuzkoa\)?/ig,'').replace(/\b20600\b/g,'').replace(/[\s,.-]*eibar$/i,'').replace(/[\s,.-]+$/,'').replace(/\s{2,}/g,' ').trim();
function cAcc(s){const n=nrm(s),a=[]; if(/libre/.test(n))a.push('libre'); if(/cita/.test(n))a.push('cita'); if(/deriv/.test(n))a.push('deriv'); return a;}
const bilingue=(s,lang)=>{const p=String(s||'').split('//').map(x=>x.trim()); return p.length>1?(lang==='eu'?p[0]:p[1]):p[0];};

function quitarEntidad(k){
  delete E[k];
  NEEDS.forEach(n=>{n.principal=n.principal.filter(x=>x!==k); n.tambien=n.tambien.filter(x=>x!==k);});
  Object.values(FASES).forEach(f=>f.agentes=f.agentes.filter(x=>x!==k));
  DATA.empezar=(DATA.empezar||[]).filter(s=>s.id!==k);
}
function needsFrom(c){
  const n=k=>nrm(c[k]),out=new Set();
  if(/buscar|mejorar|orientacion laboral|intermedia/.test(n('emp'))) out.add('trabajo');
  if(/emprend/.test(n('emp'))) out.add('emprender');
  if(/castellano|euskera/.test(n('for'))) out.add('idioma');
  if(/basica|homolog/.test(n('for'))) out.add('estudiar');
  if(/profesional|digital|certific|para el empleo|para la busqueda/.test(n('for'))) out.add('curso');
  if(/informacion y orientacion/.test(n('apo'))) out.add('orientarme');
  if(/redes|acompan/.test(n('apo'))) out.add('apoyosocial');
  if(/ayudas econ/.test(n('ayu'))) out.add('ingresos');
  if(/administrativ/.test(n('ayu'))) out.add('papeles');
  if(n('viv')) out.add('vivienda'); if(n('sal')) out.add('salud'); if(n('cui')) out.add('cuidados');
  return [...out];
}

function applyLive(rows){
  const H=rows[0].map(h=>String(h).replace(/\s+/g,' ').trim());
  const col=(test)=>H.findIndex(test);
  const C={nom:1,web:col(h=>/p[aá]gina web/i.test(h)),dir:col(h=>/direcci[oó]n completa/i.test(h)),
    tipo:col(h=>/describa vuestra organizaci|selecciona la opci/i.test(h)),desc:col(h=>/describa brevemente/i.test(h)),
    emp:col(h=>h==='ENPLEGUA // EMPLEO'),for:col(h=>h==='PRESTAKUNTZA // FORMACIÓN'),apo:col(h=>h==='GIZARTE-LAGUNTZA // APOYO SOCIAL'),
    ayu:col(h=>/^LAGUNTZA EKONOMIKOAK/.test(h)),viv:col(h=>h==='ETXEBIZITZA // VIVIENDA'),sal:col(h=>h==='OSASUNA // SALUD'),
    cui:col(h=>/^ZAINTZA ETA KONTZILIAZIOA/.test(h)),acc:col(h=>/forma de acceso/i.test(h)),
    bj:col(h=>/EN EIBAR$/i.test(h)&&!/FUERA/i.test(h)),bk:col(h=>/FUERA DE EIBAR/i.test(h))};
  const g=(r,k)=>C[k]>=0?String(r[C[k]]??'').trim():'';
  const seen=new Set(); let nuevos=0, n=0;
  rows.slice(1).forEach(r=>{
    const nom=g(r,'nom'); if(!nom) return; n++;
    const hit=MATCH.find(([k,re])=>!seen.has(k)&&re.test(nrm(nom)));
    let id=hit&&hit[0], a;
    if(id){ seen.add(id); if(OCULTAS.has(id)) return; a=E[id]; if(!a) return; }
    else {
      id='nueva'+(++nuevos); if(OCULTAS.has(id)) return;
      const tipo=g(r,'tipo');
      a=E[id]={real:true,excel:true,nuevo:true,puerta:false,cat:'',nombre_es:titleIfCaps(nom),nombre_eu:titleIfCaps(nom),
        tipo_es:bilingue(tipo,'es'),tipo_eu:bilingue(tipo,'eu'),orient:g(r,'emp')?['empleo']:[],acceso:[],
        resumen_es:'',resumen_eu:'',eibar_live:g(r,'bj')||g(r,'desc'),web:cWeb(g(r,'web'))};
      const d=cDir(g(r,'dir')); a.dir_es=d; a.dir_eu=d;
      const svc={emp:g(r,'emp'),for:g(r,'for'),apo:g(r,'apo'),ayu:g(r,'ayu'),viv:g(r,'viv'),sal:g(r,'sal'),cui:g(r,'cui')};
      needsFrom(svc).forEach(nid=>{const ne=NB[nid]; if(ne&&!ne.tambien.includes(id)&&!ne.principal.includes(id)) ne.tambien.push(id);});
      const FA={emp:'orientlab',for:'formacion',apo:'apoyo',ayu:'prestaciones',viv:'vivienda',sal:'salud',cui:'apoyo'};
      Object.keys(FA).forEach(k=>{ if(svc[k]){ const f=FA[k]; if(!FASES[f].agentes.includes(id)) FASES[f].agentes.push(id);} });
    }
    const acc=cAcc(g(r,'acc')); if(acc.length && !a.acceso_fijo && a.nuevo) a.acceso=acc;
    const bj=g(r,'bj'), bk=g(r,'bk');
    if(!a.nuevo){
      if(bj && a.src_bj!=null && nrm(bj)!==nrm(a.src_bj)) a.eibar_live=bj;
      if(bk && a.src_bk!=null && nrm(bk)!==nrm(a.src_bk)) a.fuera_live=bk;
    }
  });
  Object.keys(E).forEach(k=>{ if(E[k].excel && !E[k].nuevo && !seen.has(k)) quitarEntidad(k); });
  return n;
}

/* ---------- CORRECCIONES ----------
   Columnas: ID | ENTIDAD | ACCIÓN | CAMPO | VALOR (castellano) | VALOR (euskera) | MOTIVO | QUIÉN LO PIDE / FUENTE | FECHA | ACTIVA
   ACCIÓN: corregir · ocultar · desdoblar · añadir · quitar */
const CAMPOS_TXT=['nombre','corto','tipo','resumen','eibar','fuera','dir','horario','contacto'];
const CAMPOS_ALIAS={'en eibar':'eibar','en_eibar':'eibar','eibarren':'eibar','fuera de eibar':'fuera','direccion':'dir','descripcion':'resumen','telefono':'tel','correo':'email','e-mail':'email','categoria':'cat','nombre corto':'corto'};
const BASE=fechaNum(DATA.meta.base);
function fechaNum(s){ const m=String(s||'').match(/(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/); if(m){const y=+m[3]<100?2000+ +m[3]:+m[3]; return y*10000+ +m[2]*100+ +m[1];}
  const d=String(s||'').match(/Date\((\d{4}),(\d{1,2}),(\d{1,2})/); if(d) return +d[1]*10000+(+d[2]+1)*100+ +d[3]; return null; }
function applyCorrecciones(rows){
  const H=rows[0].map(h=>nrm(h));
  const ix=(re,def)=>{const i=H.findIndex(h=>re.test(h)); return i>=0?i:def;};
  const I={ent:ix(/^entidad/,1),acc:ix(/^accion/,2),campo:ix(/^campo/,3),es:ix(/castellano|^valor$|valor es/,4),eu:ix(/euskera|valor eu/,5),fecha:ix(/^fecha/,8),act:ix(/^activa/,9)};
  const res={estado:'ok',nuevas:0,incluidas:0,avisos:0};
  rows.slice(1).forEach((r,i)=>{
    const v=k=>String(r[I[k]]??'').trim();
    if(!v('ent')&&!v('acc')) return;
    if(/^(no|ez|0|false)\b/i.test(v('act'))) return;
    const f=fechaNum(v('fecha'));
    if(f!=null && f<=BASE){ res.incluidas++; return; }
    const ent=nrm(v('ent')).replace(/\s+/g,''), acc=nrm(v('acc')), es=v('es'), eu=v('eu');
    let campo=nrm(v('campo')); campo=CAMPOS_ALIAS[campo]||campo;
    const aviso=m=>{res.avisos++; LIVE.avisos.push(`Fila ${i+2}: ${m}`);};
    const ok=()=>res.nuevas++;
    if(ent.startsWith('necesidad:')){
      const ne=NB[ent.split(':')[1]]; if(!ne){aviso('necesidad desconocida');return;}
      if(campo==='nota'){ if(es) ne.nota_es=es; if(eu) ne.nota_eu=eu; ok(); }
      else if(campo==='subtitulo'){ if(es) ne.sub_es=es; if(eu) ne.sub_eu=eu; ok(); }
      else if(campo==='nombre'){ if(es) ne.es=es; if(eu) ne.eu=eu; ok(); }
      else aviso('campo de necesidad desconocido');
      return;
    }
    if(acc==='ocultar'){
      if(!campo){ OCULTAS.add(ent); if(E[ent]) quitarEntidad(ent); ok(); }
      else if(E[ent]){ if(CAMPOS_TXT.includes(campo)){E[ent][campo+'_es']='';E[ent][campo+'_eu']='';} else E[ent][campo]=''; ok(); }
      else aviso(`entidad «${ent}» desconocida`);
      return;
    }
    if(acc==='desdoblar'){
      const src=E[ent], nid=campo.replace(/\s+/g,'');
      if(!src){aviso('entidad origen desconocida');return;}
      if(!E[nid]) E[nid]={real:true,excel:false,puerta:false,cat:src.cat,derivado_de:ent,tipo_es:src.tipo_es,tipo_eu:src.tipo_eu,web:src.web,acceso:[],orient:[],
        nombre_es:es||nid,nombre_eu:eu||es||nid,resumen_es:'',resumen_eu:'',eibar_es:'',eibar_eu:''};
      ok(); return;
    }
    if(acc==='anadir'||acc==='añadir'){
      if(!E[ent]) E[ent]={real:true,excel:false,puerta:false,cat:'acogida',acceso:[],orient:[],nombre_es:ent,nombre_eu:ent,resumen_es:'',resumen_eu:'',eibar_es:'',eibar_eu:''};
      if(campo.startsWith('necesidad')){ const [nid,tipo]=es.split(':').map(x=>nrm(x)); const ne=NB[nid];
        if(!ne){aviso('necesidad desconocida');return;}
        const lst=tipo==='principal'?ne.principal:ne.tambien; if(!ne.principal.includes(ent)&&!ne.tambien.includes(ent)) lst.push(ent); ok(); return; }
      if(campo==='fase'){ const fz=FASES[nrm(es)]; if(!fz){aviso('fase desconocida');return;} if(!fz.agentes.includes(ent)) fz.agentes.push(ent); ok(); return; }
      if(!campo){ ok(); return; }
    }
    if(acc==='quitar'){
      const [tipo,ref]=es.split(':').map(x=>nrm(x));
      if(tipo==='necesidad'&&NB[ref]){ NB[ref].principal=NB[ref].principal.filter(x=>x!==ent); NB[ref].tambien=NB[ref].tambien.filter(x=>x!==ent); ok(); }
      else if(tipo==='fase'&&FASES[ref]){ FASES[ref].agentes=FASES[ref].agentes.filter(x=>x!==ent); ok(); }
      else aviso('«quitar» necesita «necesidad:id» o «fase:id» en el valor');
      return;
    }
    const a=E[ent]; if(!a){aviso(`entidad «${ent}» desconocida`);return;}
    if(CAMPOS_TXT.includes(campo)){
      if(es) a[campo+'_es']=es; if(eu) a[campo+'_eu']=eu;
      if(campo==='eibar'&&(es||eu)){ delete a.eibar_live; if(es) a.resumen_es=es; if(eu) a.resumen_eu=eu; }
      if(campo==='resumen'&&(es||eu)){ if(es) a.eibar_es=es; if(eu) a.eibar_eu=eu; delete a.eibar_live; }
      if(campo==='fuera'&&(es||eu)) delete a.fuera_live;
      ok();
    } else if(['tel','email','web'].includes(campo)){ a[campo]=es; ok(); }
    else if(campo==='cat'){ if(CATS.some(c=>c.id===nrm(es))){a.cat=nrm(es); ok();} else aviso('categoría desconocida (acogida, trabajo, cursos, salud)'); }
    else if(campo==='acceso'){ a.acceso=cAcc(es); a.acceso_fijo=true; ok(); }
    else if(campo==='aviso'){ a.validar=!/^(no|ez)$/i.test(es); ok(); }
    else if(campo.startsWith('tarjeta:')){ const ne=NB[campo.split(':')[1]]; if(!ne){aviso('necesidad desconocida');return;}
      ne.tarjetas=ne.tarjetas||{}; ne.tarjetas[ent]={es,eu:eu||''}; ok(); }
    else aviso(`campo «${campo}» desconocido`);
  });
  return res;
}

async function viaFetch(url){
  const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),10000);
  try{ const res=await fetch(url,{signal:ctl.signal}); if(!res.ok) throw new Error('HTTP '+res.status); return parseCSV(await res.text()); }
  finally{ clearTimeout(to); }
}
function viaJSONP(extra){
  return new Promise((resolve,reject)=>{
    const cb='__ibil'+Date.now()+Math.floor(Math.random()*1e4); const sc=document.createElement('script');
    const to=setTimeout(()=>{cleanup();reject(new Error('timeout jsonp'))},12000);
    function cleanup(){clearTimeout(to);delete window[cb];sc.remove();}
    window[cb]=resp=>{cleanup();
      try{ if(resp.status==='error') throw new Error((resp.errors||[]).map(e=>e.detailed_message||e.message).join('; '));
        const tb=resp.table; const head=tb.cols.map(c=>c.label||'');
        const rows=[head,...tb.rows.map(r=>(r.c||[]).map(c=>c?(c.f!=null?c.f:(c.v!=null?String(c.v):'')):''))];
        resolve(rows);}catch(e){reject(e);} };
    sc.onerror=()=>{cleanup();reject(new Error('script bloqueado'))};
    sc.src=GVIZ+'?headers=1&tqx=responseHandler:'+cb+extra+'&t='+Date.now();
    document.head.appendChild(sc);
  });
}
const okRows=r=>r && r.length>=2 && /marca temporal/i.test(r[0][0]||'');
async function leerRespuestas(){
  for(const [via,fn] of [['csv-publicado',()=>viaFetch(SHEET_CSV)],['jsonp-gviz',()=>viaJSONP('&gid=0')],['csv-gviz',()=>viaFetch(GVIZ+'?tqx=out:csv&headers=1&gid=0')]]){
    try{ const rows=await fn(); if(!okRows(rows)) throw new Error('formato inesperado'); return rows; }
    catch(err){ console.warn('Respuestas no disponibles vía',via,err); }
  }
  return null;
}
const NOMBRES_CORR=['CORRECCIONES','ZUZENKETAK'];
function esCorrecciones(rows){
  if(!rows||!rows[0]) return 'no';
  const h=rows[0].map(x=>nrm(x));
  if(h.some(x=>/^accion\b/.test(x)) && h.some(x=>/^entidad\b/.test(x))) return 'ok';
  if(h.filter(Boolean).length<=2 && /id,entidad,acci/.test(h.join(','))) return 'una-columna';
  return 'no';
}
async function leerCorrecciones(){
  let estado='no';
  for(const nom of NOMBRES_CORR){
    const s='&sheet='+encodeURIComponent(nom);
    for(const [via,fn] of [['jsonp-gviz',()=>viaJSONP(s)],['csv-gviz',()=>viaFetch(GVIZ+'?tqx=out:csv&headers=1'+s)]]){
      try{ const rows=await fn(); const e=esCorrecciones(rows);
        if(e==='ok') return {estado:'ok',rows};
        if(e==='una-columna') estado='una-columna';
        break;
      }catch(err){ console.warn('Correcciones no disponibles vía',via,nom,err); }
    }
  }
  return {estado,rows:null};
}
async function loadLive(){
  if(window.__TEST_ROWS){ const c=window.__TEST_CORR||null; const e=esCorrecciones(c); return finish(window.__TEST_ROWS,{estado:e,rows:e==='ok'?c:null}); }
  const [rows,corr]=await Promise.all([leerRespuestas(),leerCorrecciones()]);
  finish(rows,corr);
}
function finish(rows,corr){
  if(!rows){ LIVE.state='fail'; render(); return; }
  if(corr.rows) corr.rows.slice(1).forEach(r=>{ const f=fechaNum(r[8]); if(/ocultar/i.test(r[2]||'')&&!String(r[3]||'').trim()&&!(f!=null&&f<=BASE)&&!/^(no|ez)/i.test(r[9]||'')) OCULTAS.add(nrm(r[1]).replace(/\s+/g,'')); });
  const n=applyLive(rows);
  LIVE.corr=corr.rows?applyCorrecciones(corr.rows):{estado:corr.estado,nuevas:0,incluidas:0,avisos:0};
  const now=new Date(), pad=x=>String(x).padStart(2,'0');
  LIVE.state='ok'; LIVE.n=n; LIVE.hora=`${pad(now.getHours())}:${pad(now.getMinutes())}`;
  if(LIVE.avisos.length) console.warn('Correcciones no aplicadas:\n'+LIVE.avisos.join('\n'));
  render();
}

try{const s=localStorage.getItem('ibil-lang'); if(s==='eu'||s==='es'){LANG=s;document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===LANG)));}}catch(_){}
const h0=(location.hash||'').slice(1); if(['needs','itin','dir'].includes(h0)) VIEW=h0;
setView(VIEW);
loadLive();
</script>
